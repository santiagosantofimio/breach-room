spring.application.name=breach-room
spring.main.lazy-initialization=true
spring.main.banner-mode=off

server.port=${PORT:8080}
server.forward-headers-strategy=none
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.threads.max=16
server.tomcat.max-swallow-size=16KB
server.tomcat.max-http-form-post-size=8KB

breach.flag-secret=${FLAG_SECRET}
breach.session-secret=${SESSION_SECRET}
breach.allowed-origin=${ALLOWED_ORIGIN}
breach.trusted-proxy-hops=3
breach.rate-limit.ip-capacity=120
breach.rate-limit.ip-refill-per-second=2
breach.rate-limit.session-capacity=60
breach.rate-limit.session-refill-per-second=1
breach.rate-limit.max-tracked-keys=10000
